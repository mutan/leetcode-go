name: leetcode-go

networks:
  go-network:
    name: go-network

services:

  go-cli:
    image: golang:1.26.4-bookworm
    container_name: leetcode-go-cli
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: always
    networks:
      - go-network

volumes:
  go-mod-cache:
  go-build-cache: